name: Course integrity
on: [push, pull_request]
jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python academy.py next
      - run: python -m pytest -q
      # Student acceptance tests are explicit and fail until independently implemented.
      # Course CI never awards a learner pass.
